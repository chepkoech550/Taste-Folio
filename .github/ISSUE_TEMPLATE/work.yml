name: Work item
description: Define a focused task with a clear completion check.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or access needed
      description: Name the dependency only. Never paste API keys or passwords.
