name: Bug
description: Report something that does not work as expected.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use example data. Do not include secrets or private customer information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
